<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM-JAY Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1e3d;--blue:#1a3a6e;--accent:#f0a500;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--light:#eef3fc;--border:#cdd8f0;--text:#1e293b;--muted:#64748b;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins','Noto Sans Gujarati',sans-serif;background:#eef3fc;min-height:100vh;color:var(--text);}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0b1e3d,#1a3a6e);}
.login-box{background:#fff;border-radius:24px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo .icon{font-size:48px;}
.login-logo h1{color:var(--navy);font-size:1.2rem;font-weight:700;font-family:'Noto Sans Gujarati',sans-serif;margin-top:8px;}
.login-logo p{color:var(--muted);font-size:.78rem;margin-top:4px;}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,#0b1e3d,#1a3a6e);padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.3);}
.topbar h1{color:var(--accent);font-size:1rem;font-weight:700;font-family:'Noto Sans Gujarati',sans-serif;}
.topbar p{color:#8aaed4;font-size:.68rem;}
.logout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 14px;border-radius:8px;font-size:.78rem;cursor:pointer;font-family:'Noto Sans Gujarati',sans-serif;transition:background .2s;}
.logout-btn:hover{background:rgba(255,255,255,.2);}

/* MAIN */
#admin-main{display:none;max-width:900px;margin:0 auto;padding:20px 16px;}

/* CARD */
.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 2px 14px rgba(0,0,0,.07);border:1px solid var(--border);}
.card-title{font-size:.92rem;font-weight:700;color:var(--blue);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid var(--light);font-family:'Noto Sans Gujarati',sans-serif;}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{margin-bottom:14px;}
.form-group.full{grid-column:1/-1;}
label{display:block;font-size:.74rem;font-weight:600;color:var(--muted);margin-bottom:5px;font-family:'Noto Sans Gujarati',sans-serif;}
input[type=text],input[type=password],textarea{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:11px;font-size:.88rem;font-family:'Poppins',sans-serif;color:var(--text);background:var(--light);outline:none;transition:border .2s,background .2s;}
input:focus,textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(26,58,110,.1);}
textarea{resize:vertical;min-height:70px;}

/* LOGO UPLOAD */
.logo-upload{border:2px dashed var(--border);border-radius:14px;padding:20px;text-align:center;cursor:pointer;transition:border .2s,background .2s;background:var(--light);}
.logo-upload:hover{border-color:var(--blue);background:#e8f0fe;}
.logo-upload input{display:none;}
.logo-preview{width:80px;height:80px;border-radius:12px;object-fit:cover;margin:0 auto 8px;display:block;}
.logo-placeholder{font-size:40px;margin-bottom:6px;}
.logo-upload p{font-size:.76rem;color:var(--muted);font-family:'Noto Sans Gujarati',sans-serif;}

/* BUTTONS */
.btn{padding:11px 20px;border:none;border-radius:11px;font-size:.86rem;font-weight:700;cursor:pointer;font-family:'Noto Sans Gujarati',sans-serif;transition:transform .15s;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,#1a3a6e,#2a5298);color:#fff;box-shadow:0 4px 12px rgba(26,58,110,.3);}
.btn-green{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.25);}
.btn-red{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;box-shadow:0 4px 12px rgba(220,38,38,.25);}
.btn-outline{background:none;border:2px solid var(--border);color:var(--text);}
.btn-sm{padding:6px 14px;font-size:.76rem;border-radius:8px;}
.btn-full{width:100%;}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:14px;padding:16px;text-align:center;border:2px solid var(--border);}
.stat-card .snum{font-size:2rem;font-weight:700;}
.stat-card .slabel{font-size:.68rem;color:var(--muted);margin-top:4px;font-family:'Noto Sans Gujarati',sans-serif;}
.c-blue .snum{color:var(--blue);}.c-green .snum{color:var(--green);}.c-orange .snum{color:var(--orange);}

/* HOSPITAL GRID */
.hospital-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.hosp-card{background:#fff;border-radius:16px;padding:18px;border:2px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;}
.hosp-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1);}
.hosp-card.inactive{opacity:.6;border-style:dashed;}
.hosp-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.hosp-logo{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid var(--border);}
.hosp-logo img{width:100%;height:100%;border-radius:10px;object-fit:cover;}
.hosp-name{font-size:.9rem;font-weight:700;color:var(--navy);}
.hosp-code{font-size:.72rem;color:var(--muted);margin-top:2px;}
.hosp-meta{font-size:.74rem;color:var(--muted);margin-bottom:12px;line-height:1.6;}
.hosp-actions{display:flex;gap:8px;}
.badge-active{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.66rem;font-weight:700;background:#dcfce7;color:#16a34a;}
.badge-inactive{background:#fee2e2;color:#dc2626;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-title{font-size:1rem;font-weight:700;color:var(--blue);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;font-family:'Noto Sans Gujarati',sans-serif;padding-bottom:12px;border-bottom:2px solid var(--light);}
.close-modal{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0b1e3d;color:#fff;padding:12px 24px;border-radius:30px;font-size:.82rem;font-family:'Noto Sans Gujarati',sans-serif;box-shadow:0 4px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;}

/* LOGIN FORM */
.form-group-login{margin-bottom:16px;}
.form-group-login label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;font-family:'Noto Sans Gujarati',sans-serif;}
.form-group-login input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:.92rem;font-family:'Poppins',sans-serif;outline:none;background:var(--light);transition:border .2s;}
.form-group-login input:focus{border-color:var(--blue);background:#fff;}

@media(max-width:500px){.form-grid{grid-template-columns:1fr;}.stats-row{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">🔐</div>
      <h1>Admin Panel</h1>
      <p>PM-JAY ફોલોઅપ ટ્રેકર</p>
    </div>
    <div class="form-group-login">
      <label>Admin Username</label>
      <input type="text" id="admin-user" placeholder="admin" />
    </div>
    <div class="form-group-login">
      <label>Password</label>
      <input type="password" id="admin-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')adminLogin()" />
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:8px;" onclick="adminLogin()">Login →</button>
    <p id="login-err" style="color:var(--red);font-size:.78rem;margin-top:10px;text-align:center;font-family:'Noto Sans Gujarati',sans-serif;display:none;">❌ Username અથવા Password ખોટો</p>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar" id="admin-topbar" style="display:none;">
  <div>
    <h1>🏥 PM-JAY Admin Panel</h1>
    <p>Hospital Management System</p>
  </div>
  <button class="logout-btn" onclick="adminLogout()">Logout</button>
</div>

<!-- MAIN -->
<div id="admin-main">
  <div class="stats-row">
    <div class="stat-card c-blue"><div class="snum" id="st-total">0</div><div class="slabel">કુલ Hospitals</div></div>
    <div class="stat-card c-green"><div class="snum" id="st-active">0</div><div class="slabel">✅ Active</div></div>
    <div class="stat-card c-orange"><div class="snum" id="st-inactive">0</div><div class="slabel">❌ Inactive</div></div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>🏥 Hospitals</span>
      <button class="btn btn-green btn-sm" onclick="openAddModal()">+ નવી Hospital ઉમેરો</button>
    </div>
    <div class="hospital-grid" id="hosp-grid">
      <div style="text-align:center;padding:40px;color:var(--muted);grid-column:1/-1;font-family:'Noto Sans Gujarati',sans-serif;">
        ⏳ Loading...
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="hosp-modal">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-title-text">🏥 નવી Hospital ઉમેરો</span>
      <button class="close-modal" onclick="closeModal()">✕</button>
    </div>

    <input type="hidden" id="edit-id" />

    <!-- Logo Upload -->
    <div class="form-group">
      <label>Hospital Logo / Photo</label>
      <div class="logo-upload" onclick="document.getElementById('logo-input').click()">
        <input type="file" id="logo-input" accept="image/*" onchange="previewLogo(this)" />
        <div id="logo-preview-wrap">
          <div class="logo-placeholder">🏥</div>
          <p>Logo upload કરવા tap કરો<br><span style="font-size:.68rem;">(JPG, PNG — max 500KB)</span></p>
        </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Hospital નું નામ *</label>
        <input type="text" id="h-name" placeholder="દા.ત. Civil Hospital" />
      </div>
      <div class="form-group">
        <label>Hospital Code * <span style="font-size:.66rem;color:var(--muted);">(Login ID)</span></label>
        <input type="text" id="h-code" placeholder="CIVIL001" style="text-transform:uppercase;" />
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="h-pass" placeholder="••••••••" />
      </div>
      <div class="form-group">
        <label>શહેર / જિલ્લો</label>
        <input type="text" id="h-city" placeholder="અમદાવાદ" />
      </div>
      <div class="form-group full">
        <label>સરનામું</label>
        <textarea id="h-addr" placeholder="Hospital નું સરનામું..."></textarea>
      </div>
      <div class="form-group">
        <label>Contact No.</label>
        <input type="text" id="h-phone" placeholder="02712-XXXXXX" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="h-status" style="width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:11px;font-size:.88rem;background:var(--light);outline:none;font-family:'Poppins',sans-serif;">
          <option value="active">✅ Active</option>
          <option value="inactive">❌ Inactive</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="btn btn-outline btn-full" onclick="closeModal()">રદ કરો</button>
      <button class="btn btn-primary btn-full" id="save-btn" onclick="saveHospital()">✅ સ્ટોર કરો</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc,
  addDoc, getDocs, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBtSQX-9vWtCyAei5VkBNJd-hk9Q3UpyZM",
  authDomain: "pmjay-tracker.firebaseapp.com",
  projectId: "pmjay-tracker",
  storageBucket: "pmjay-tracker.firebasestorage.app",
  messagingSenderId: "998566041305",
  appId: "1:998566041305:web:c3d726530439e147bad0c8"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const hCol = collection(db, "hospitals");

// ADMIN CREDENTIALS
const ADMIN = { user: "pmjayadmin", pass: "Admin@PMJAY2024" };

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// LOGIN
window.adminLogin = function() {
  const u = document.getElementById('admin-user').value.trim();
  const p = document.getElementById('admin-pass').value;
  if (u === ADMIN.user && p === ADMIN.pass) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-topbar').style.display = 'flex';
    document.getElementById('admin-main').style.display = 'block';
    sessionStorage.setItem('pmjay_admin', '1');
    loadHospitals();
  } else {
    document.getElementById('login-err').style.display = 'block';
    setTimeout(() => document.getElementById('login-err').style.display = 'none', 3000);
  }
};

window.adminLogout = function() {
  sessionStorage.removeItem('pmjay_admin');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-topbar').style.display = 'none';
  document.getElementById('admin-main').style.display = 'none';
};

// Auto-login if session exists
if (sessionStorage.getItem('pmjay_admin')) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-topbar').style.display = 'flex';
  document.getElementById('admin-main').style.display = 'block';
  loadHospitals();
}

// LOAD HOSPITALS
let hospitals = [];
let logoBase64 = '';

function loadHospitals() {
  onSnapshot(query(hCol, orderBy("createdAt", "asc")), snap => {
    hospitals = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderHospitals();
    updateStats();
  });
}

function updateStats() {
  const active = hospitals.filter(h => h.status === 'active').length;
  document.getElementById('st-total').textContent = hospitals.length;
  document.getElementById('st-active').textContent = active;
  document.getElementById('st-inactive').textContent = hospitals.length - active;
}

function renderHospitals() {
  const grid = document.getElementById('hosp-grid');
  if (!hospitals.length) {
    grid.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted);grid-column:1/-1;font-family:'Noto Sans Gujarati',sans-serif;"><div style="font-size:36px;margin-bottom:8px;">🏥</div>કોઈ Hospital નથી. ઉમેરો!</div>`;
    return;
  }
  grid.innerHTML = hospitals.map(h => `
    <div class="hosp-card ${h.status !== 'active' ? 'inactive' : ''}">
      <div class="hosp-header">
        <div class="hosp-logo">
          ${h.logo ? `<img src="${h.logo}" alt="${h.name}" />` : '🏥'}
        </div>
        <div>
          <div class="hosp-name">${h.name}</div>
          <div class="hosp-code">Code: ${h.code}</div>
        </div>
      </div>
      <div class="hosp-meta">
        ${h.city ? `📍 ${h.city}<br>` : ''}
        ${h.phone ? `📞 ${h.phone}<br>` : ''}
        ${h.address ? `🏠 ${h.address.substring(0,50)}${h.address.length>50?'...':''}` : ''}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span class="badge-active ${h.status !== 'active' ? 'badge-inactive' : ''}">${h.status === 'active' ? '✅ Active' : '❌ Inactive'}</span>
      </div>
      <div class="hosp-actions">
        <button class="btn btn-outline btn-sm btn-full" onclick="editHospital('${h.id}')">✏️ Edit</button>
        <button class="btn btn-red btn-sm" onclick="deleteHospital('${h.id}','${h.name}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

// MODAL
window.openAddModal = function() {
  document.getElementById('modal-title-text').textContent = '🏥 નવી Hospital ઉમેરો';
  document.getElementById('edit-id').value = '';
  document.getElementById('h-name').value = '';
  document.getElementById('h-code').value = '';
  document.getElementById('h-pass').value = '';
  document.getElementById('h-city').value = '';
  document.getElementById('h-addr').value = '';
  document.getElementById('h-phone').value = '';
  document.getElementById('h-status').value = 'active';
  document.getElementById('logo-input').value = '';
  document.getElementById('logo-preview-wrap').innerHTML = `<div class="logo-placeholder">🏥</div><p>Logo upload કરવા tap કરો<br><span style="font-size:.68rem;">(JPG, PNG — max 500KB)</span></p>`;
  logoBase64 = '';
  document.getElementById('hosp-modal').classList.add('show');
};

window.editHospital = function(id) {
  const h = hospitals.find(x => x.id === id);
  if (!h) return;
  document.getElementById('modal-title-text').textContent = '✏️ Hospital Edit કરો';
  document.getElementById('edit-id').value = id;
  document.getElementById('h-name').value = h.name || '';
  document.getElementById('h-code').value = h.code || '';
  document.getElementById('h-pass').value = h.pass || '';
  document.getElementById('h-city').value = h.city || '';
  document.getElementById('h-addr').value = h.address || '';
  document.getElementById('h-phone').value = h.phone || '';
  document.getElementById('h-status').value = h.status || 'active';
  logoBase64 = h.logo || '';
  if (h.logo) {
    document.getElementById('logo-preview-wrap').innerHTML = `<img src="${h.logo}" class="logo-preview" /><p style="font-size:.72rem;color:var(--muted);">Logo change કરવા tap કરો</p>`;
  }
  document.getElementById('hosp-modal').classList.add('show');
};

window.closeModal = function() {
  document.getElementById('hosp-modal').classList.remove('show');
};

// LOGO PREVIEW
window.previewLogo = function(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 500 * 1024) { toast('⚠️ Logo 500KB થી નાની હોવી જોઈએ'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    logoBase64 = e.target.result;
    document.getElementById('logo-preview-wrap').innerHTML = `<img src="${logoBase64}" class="logo-preview" /><p style="font-size:.72rem;color:var(--muted);">Logo change કરવા tap કરો</p>`;
  };
  reader.readAsDataURL(file);
};

// SAVE HOSPITAL
window.saveHospital = async function() {
  const name  = document.getElementById('h-name').value.trim();
  const code  = document.getElementById('h-code').value.trim().toUpperCase();
  const pass  = document.getElementById('h-pass').value.trim();
  const city  = document.getElementById('h-city').value.trim();
  const addr  = document.getElementById('h-addr').value.trim();
  const phone = document.getElementById('h-phone').value.trim();
  const status = document.getElementById('h-status').value;
  const editId = document.getElementById('edit-id').value;

  if (!name)  { toast('⚠️ Hospital નું નામ ભરો'); return; }
  if (!code)  { toast('⚠️ Hospital Code ભરો'); return; }
  if (!pass)  { toast('⚠️ Password ભરો'); return; }

  // Check duplicate code
  const dup = hospitals.find(h => h.code === code && h.id !== editId);
  if (dup) { toast('⚠️ આ Hospital Code પહેલાથી છે'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '⏳...';

  const data = { name, code, pass, city, address: addr, phone, status, logo: logoBase64 };

  try {
    if (editId) {
      await updateDoc(doc(db, "hospitals", editId), data);
      toast('✅ Hospital update!');
    } else {
      await addDoc(hCol, { ...data, createdAt: new Date().toISOString() });
      toast('✅ Hospital ઉમેરાઈ!');
    }
    closeModal();
  } catch(e) { toast('❌ ' + e.message); }
  finally { btn.disabled = false; btn.textContent = '✅ સ્ટોર કરો'; }
};

// DELETE
window.deleteHospital = async function(id, name) {
  if (!confirm(`"${name}" ડિલીટ કરવી?\n(Hospital નો બધો patient data પણ ડિલીટ થશે)`)) return;
  try {
    await deleteDoc(doc(db, "hospitals", id));
    toast('🗑️ Hospital ડિલીટ!');
  } catch(e) { toast('❌ ' + e.message); }
};

// Close modal on overlay click
document.getElementById('hosp-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
